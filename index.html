<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        try {
          var _fetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return _fetch;
            },
            set: function(val) {
              _fetch = val;
            }
          });
        } catch (e) {
          try {
            var proto = Object.getPrototypeOf(window);
            var _protoFetch = proto.fetch || window.fetch;
            Object.defineProperty(proto, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function() { return _protoFetch; },
              set: function(val) { _protoFetch = val; }
            });
          } catch (_) {}
        }

        window.addEventListener('error', function(event) {
          if (event && event.filename && event.filename.indexOf('chrome-extension://') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation && event.stopImmediatePropagation();
            return false;
          }
        }, true);
      })();
    </script>
    <title>ScaleUp Operations Portal</title>
